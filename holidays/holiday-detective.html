<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<style>
  .task { color: var(--muted); font-size: clamp(15px, 2.6vh, 20px); font-weight: 700; margin: 12px 0 0; text-align: center; }
  .clue {
    display: flex; align-items: center; gap: 14px;
    max-width: 760px;
    margin: clamp(10px, 2.5vh, 22px) 0;
    padding: clamp(12px, 2.4vh, 20px) clamp(16px, 3vw, 26px);
    border-radius: 18px;
    background: linear-gradient(180deg, var(--card-top), var(--card));
    border: 1px solid var(--card-edge);
    border-left: 5px solid var(--green);
  }
  .clue .icon { font-size: clamp(28px, 5vh, 40px); }
  .clue .txt { font-size: clamp(20px, 3.8vh, 30px); font-weight: 500; line-height: 1.3; }
  .clue button {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--card-edge); background: var(--bg2); color: var(--green);
    display: grid; place-items: center; cursor: pointer;
  }
  .clue button svg { width: 22px; height: 22px; }
  .opts {
    --w: min(42vw, 26vh, 220px);
    display: grid; grid-template-columns: repeat(4, var(--w));
    gap: clamp(10px, 2vw, 16px);
  }
  @media (max-aspect-ratio: 5/4) { .opts { grid-template-columns: repeat(2, var(--w)); } }
  .opt {
    padding: 0; overflow: hidden;
    border-radius: 16px;
    border: 2px solid var(--card-edge);
    background: var(--card);
    color: var(--text);
    font: inherit;
    cursor: pointer;
    box-shadow: 0 8px 20px #00000040;
    transition: border-color .15s, opacity .3s, transform .1s;
  }
  .opt:hover { border-color: var(--green); }
  .opt:active { transform: scale(.97); }
  .opt img { display: block; width: 100%; height: calc(var(--w) * .62); object-fit: cover; }
  .opt span { display: block; padding: 8px 6px 10px; font-size: clamp(14px, 2.3vh, 18px); font-weight: 700; }
  .opt.right { border-color: var(--green); }
  .opt.right span { background: #3ddc8433; color: var(--green); }
  .opt.wrong { border-color: var(--red); opacity: .4; }
  .opt:disabled { cursor: default; }
  .explain {
    min-height: 3.2em; margin-top: clamp(8px, 2vh, 16px);
    max-width: 700px; text-align: center;
    font-size: clamp(15px, 2.5vh, 19px); color: var(--muted);
  }
  .explain .ua { color: var(--yellow); font-weight: 500; }
  .explain b { color: var(--text); }
  #next { display: none; }
  #next.show { display: inline-flex; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>Holiday <span class="accent">Detective</span></h1>
  <div class="score" id="score">0</div>
</header>

<main>
  <div class="progress"><div id="bar"></div></div>
  <p class="task">Read the clue. Which holiday is it?</p>
  <div class="clue">
    <span class="icon">🔎</span>
    <span class="txt" id="clue"></span>
    <button id="say" aria-label="Listen" data-icon="sound"></button>
  </div>
  <div class="opts" id="opts"></div>
  <div class="explain" id="explain"></div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
  <button class="btn green" id="next" data-icon="next">Next</button>
</footer>

<script src="../assets/common.js"></script>
<script>
  // Clues come from the texts on the worksheet (holidays/usa-holidays.html)
  const HOLIDAYS = {
    ny: { name: "New Year's Day",    ua: "Новий рік",            date: "January 1",                img: "new-year" },
    pd: { name: "Presidents' Day",   ua: "День президентів",     date: "3rd Monday in February",   img: "presidents-day" },
    sp: { name: "St. Patrick's Day", ua: "День святого Патрика", date: "March 17",                 img: "st-patricks-day" },
    cd: { name: "Columbus Day",      ua: "День Колумба",         date: "2nd Monday in October",    img: "columbus-day" },
    tg: { name: "Thanksgiving",      ua: "День подяки",          date: "4th Thursday in November", img: "thanksgiving" },
    ch: { name: "Christmas",         ua: "Різдво",               date: "December 25",              img: "christmas" },
  };
  const CLUES = [
    ["ny", "People shout \"Happy New Year!\" at midnight.", "Опівночі люди кричать «З Новим роком!»"],
    ["ny", "A big shining ball drops in Times Square.", "На Таймс-сквер опускається велика блискуча куля."],
    ["ny", "People make resolutions — promises to be better.", "Люди дають обіцянки стати кращими."],
    ["ny", "The party starts on the evening of December 31st.", "Свято починається ввечері 31 грудня."],
    ["pd", "We remember George Washington and Abraham Lincoln.", "Ми вшановуємо Джорджа Вашингтона й Авраама Лінкольна."],
    ["pd", "You can see these two men on the one- and five-dollar bills.", "Цих двох чоловіків видно на банкнотах в 1 і 5 доларів."],
    ["pd", "It is on the third Monday in February.", "Воно в третій понеділок лютого."],
    ["pd", "The first president's birthday is near this day.", "Біля цього дня — день народження першого президента."],
    ["sp", "People wear green clothes and green hats.", "Люди вдягають зелений одяг і зелені капелюхи."],
    ["sp", "Its symbol is a small plant with three leaves.", "Його символ — маленька рослина з трьома листочками."],
    ["sp", "In Chicago, people make the river green.", "У Чикаго річку роблять зеленою."],
    ["sp", "If you don't wear green, someone can pinch you!", "Якщо ти не в зеленому, тебе можуть ущипнути!"],
    ["cd", "A sailor from Italy crossed the ocean in 1492.", "Моряк з Італії перетнув океан у 1492 році."],
    ["cd", "Three ships: the Niña, the Pinta and the Santa María.", "Три кораблі: «Нінья», «Пінта» і «Санта-Марія»."],
    ["cd", "Some people call it Indigenous Peoples' Day.", "Дехто називає його Днем корінних народів."],
    ["cd", "He wanted to find India but found America.", "Він хотів знайти Індію, а знайшов Америку."],
    ["tg", "Families eat turkey and pumpkin pie.", "Родини їдять індичку й гарбузовий пиріг."],
    ["tg", "People say thank you for their family, food and home.", "Люди дякують за родину, їжу й дім."],
    ["tg", "The Pilgrims and Native Americans shared a dinner in 1621.", "Пілігрими й корінні американці разом обідали в 1621 році."],
    ["tg", "It is on the fourth Thursday in November.", "Воно в четвертий четвер листопада."],
    ["ch", "Children hang stockings by the fireplace.", "Діти вішають панчохи біля каміна."],
    ["ch", "Santa Claus comes down the chimney at night.", "Санта Клаус спускається вночі через димар."],
    ["ch", "People decorate a tree and sing carols.", "Люди прикрашають ялинку й співають колядки."],
    ["ch", "Children find presents under the tree in the morning.", "Вранці діти знаходять подарунки під ялинкою."],
  ];
  const ROUNDS = 12;

  const $ = id => document.getElementById(id);
  const optsEl = $("opts"), explain = $("explain"), bar = $("bar"), scoreEl = $("score"), nextBtn = $("next");
  let queue, round, score, firstTry, done, clue;

  function start() {
    // 2 clues per holiday, mixed
    queue = shuffle(Object.keys(HOLIDAYS).flatMap(k => sample(CLUES.filter(c => c[0] === k), 2)));
    round = 0; score = 0;
    scoreEl.textContent = 0;
    bar.style.width = "0%";
    newRound();
  }

  function newRound() {
    clue = queue[round];
    firstTry = true; done = false;
    $("clue").textContent = clue[1];
    explain.innerHTML = "";
    nextBtn.classList.remove("show");
    const others = sample(Object.keys(HOLIDAYS).filter(k => k !== clue[0]), 3);
    optsEl.innerHTML = "";
    shuffle([clue[0], ...others]).forEach(k => {
      const h = HOLIDAYS[k];
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<img src="../assets/holidays/${h.img}.jpg" alt=""><span>${h.name}</span>`;
      b.addEventListener("click", () => choose(b, k));
      optsEl.appendChild(b);
    });
  }

  function choose(btn, k) {
    if (done) return;
    const h = HOLIDAYS[k];
    if (k !== clue[0]) {
      firstTry = false;
      btn.classList.add("wrong");
      btn.disabled = true;
      flash(btn, "shake");
      explain.innerHTML = `Not ${h.name} (<span class="ua">${h.ua}</span>). Read the clue again.`;
      return;
    }
    done = true;
    if (firstTry) { score++; scoreEl.textContent = score; }
    round++;
    bar.style.width = (round / ROUNDS * 100) + "%";
    btn.classList.add("right");
    flash(btn, "pop");
    optsEl.querySelectorAll(".opt").forEach(b => b.disabled = true);
    explain.innerHTML = `<b>${h.name}</b> — ${h.ua} · ${h.date}<br><span class="ua">${clue[2]}</span>`;
    nextBtn.lastChild.textContent = round >= ROUNDS ? "Finish" : "Next";
    nextBtn.classList.add("show");
  }

  nextBtn.addEventListener("click", () => {
    if (round >= ROUNDS) showResult({ score, total: ROUNDS, onAgain: start });
    else newRound();
  });
  $("say").addEventListener("click", () => clue && speak(clue[1]));
  $("restart").addEventListener("click", start);
  start();
</script>
</body>
</html>
