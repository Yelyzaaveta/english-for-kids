<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alphabet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1726;
    --bg2: #13233a;
    --card: #182a44;
    --card-edge: #22385a;
    --text: #e8eef7;
    --muted: #8aa0bd;
    --green: #3ddc84;
    --blue: #3fa9f5;
    --yellow: #ffc93c;
    --purple: #9b6dff;
    --gap: 10px;
    --cw: 80px;
    --ch: 96px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, #1d3a5f 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #2a1f55 0%, transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 14px 72px 4px;
  }
  .home {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--muted);
    text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  .home:hover { color: var(--text); border-color: var(--blue); }
  .home svg { width: 22px; height: 22px; }
  h1 {
    margin: 0;
    font-size: clamp(20px, min(4.5vh, 6.5vw), 38px);
    white-space: nowrap;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  h1 .accent {
    background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 8px 16px;
  }
  #board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--gap);
  }

  .card {
    width: var(--cw);
    height: var(--ch);
    perspective: 800px;
    cursor: pointer;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
  }
  .card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 14px; }
  .inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.3, 1.3, .5, 1);
  }
  .card.hidden .inner { transform: rotateY(180deg); }
  .card:active .inner { scale: .96; }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: calc(var(--cw) * .14);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .front {
    background: linear-gradient(180deg, #1c3150, var(--card));
    border: 1px solid var(--card-edge);
    border-bottom: 4px solid var(--c);
    box-shadow: 0 8px 20px #00000040;
    color: var(--c);
    font-weight: 800;
    line-height: 1;
  }
  .front .up { font-size: calc(var(--ch) * .56); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .front .low { font-size: calc(var(--ch) * .32); font-weight: 700; margin-left: .08em; align-self: flex-end; margin-bottom: calc(var(--ch) * .21); opacity: .8; }

  .back {
    transform: rotateY(180deg);
    background:
      repeating-linear-gradient(45deg, #ffffff0a 0 6px, transparent 6px 14px),
      linear-gradient(145deg, #2f6fd6, #6a45d8);
    border: 1px solid #ffffff22;
    box-shadow: 0 8px 20px #00000050;
    color: #ffffffd9;
    font-size: calc(var(--ch) * .46);
    font-weight: 800;
  }
  .card:hover .back { filter: brightness(1.12); }

  .card.pop .inner { animation: pop .45s ease; }
  @keyframes pop { 50% { scale: 1.08; } }

  footer {
    flex: none;
    display: flex;
    gap: 14px;
    justify-content: center;
    padding: 6px 16px max(16px, env(safe-area-inset-bottom));
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-weight: 700;
    font-size: clamp(16px, 2.6vh, 20px);
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 0;
    border-radius: 12px;
    padding: 13px 26px;
    cursor: pointer;
    transition: transform .1s, filter .15s;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(2px); }
  .reset { background: var(--yellow); color: #1a1a1a; }
  .open { background: var(--green); color: #0b2a18; }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition-duration: .01s; }
    .card.pop .inner { animation: none; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
  </a>
  <h1>The <span class="accent">Alphabet</span></h1>
</header>

<main><div id="board"></div></main>

<footer>
  <button class="btn reset" id="reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>
    Reset
  </button>
  <button class="btn open" id="openAll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    Open all
  </button>
</footer>

<script>
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const COLORS = ["var(--green)", "var(--blue)", "var(--yellow)", "var(--purple)"];
  const board = document.getElementById("board");
  let cols = 7;

  // Build cards
  const cards = LETTERS.map((L, i) => {
    const b = document.createElement("button");
    b.className = "card";
    b.style.setProperty("--c", COLORS[i % COLORS.length]);
    b.setAttribute("aria-label", L);
    b.innerHTML = `<div class="inner">
        <div class="face front"><span class="up">${L}</span><span class="low">${L.toLowerCase()}</span></div>
        <div class="face back">?</div>
      </div>`;
    b.addEventListener("click", () => {
      b.classList.toggle("hidden");
      if (!b.classList.contains("hidden")) {
        b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      }
    });
    board.appendChild(b);
    return b;
  });

  // Fit all cards on one screen: try column counts, keep the biggest card size
  function layout() {
    const main = document.querySelector("main");
    const W = main.clientWidth - 32;
    const H = main.clientHeight - 16;
    const gap = Math.max(6, Math.min(14, Math.min(W, H) * 0.018));
    const ratio = 0.84; // width / height
    let best = { cw: 0, c: 7 };
    for (let c = 3; c <= 13; c++) {
      const r = Math.ceil(LETTERS.length / c);
      const wByW = (W - gap * (c - 1)) / c;
      const wByH = ((H - gap * (r - 1)) / r) * ratio;
      const cw = Math.min(wByW, wByH);
      if (cw > best.cw) best = { cw, c };
    }
    cols = best.c;
    const cw = Math.floor(best.cw);
    const root = document.documentElement.style;
    root.setProperty("--gap", gap + "px");
    root.setProperty("--cw", cw + "px");
    root.setProperty("--ch", Math.floor(cw / ratio) + "px");
    board.style.width = (cw * cols + gap * (cols - 1) + 1) + "px";
  }

  // Hide 1–3 random letters in every row of the current layout (at most half a row)
  function reset() {
    cards.forEach(c => c.classList.remove("hidden"));
    // Group cards into rows by their actual position on screen
    const rows = new Map();
    cards.forEach(c => {
      const top = Math.round(c.offsetTop);
      if (!rows.has(top)) rows.set(top, []);
      rows.get(top).push(c);
    });
    for (const row of rows.values()) {
      const max = Math.max(1, Math.min(3, Math.floor(row.length / 2)));
      const k = 1 + Math.floor(Math.random() * max);
      row.map(c => [Math.random(), c]).sort((a, b) => a[0] - b[0])
         .slice(0, k).forEach(([, c]) => c.classList.add("hidden"));
    }
  }

  function openAll() {
    cards.forEach((c, i) => {
      if (c.classList.contains("hidden")) setTimeout(() => c.classList.remove("hidden"), i * 25);
    });
  }

  document.getElementById("reset").addEventListener("click", reset);
  document.getElementById("openAll").addEventListener("click", openAll);
  window.addEventListener("resize", layout);

  layout();
  reset();
  // Re-fit once the web font has loaded (header height may change)
  if (document.fonts) document.fonts.ready.then(() => {
    const before = cols;
    layout();
    if (cols !== before) reset();
  });
</script>
</body>
</html>
