<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<style>
  .prompt {
    display: flex; align-items: center; gap: 14px;
    margin: 14px 0 6px;
  }
  .prompt .label { color: var(--muted); font-size: clamp(18px, 3vh, 24px); font-weight: 700; }
  .prompt .word {
    font-size: clamp(34px, 7vh, 60px);
    font-weight: 800;
    letter-spacing: 2px;
    min-width: 4ch;
    text-align: center;
  }
  .prompt .word.masked { color: var(--muted); }
  .speaker {
    width: 54px; height: 54px; flex: none;
    border-radius: 50%;
    border: 0;
    background: var(--blue);
    color: #06223a;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .speaker svg { width: 26px; height: 26px; }
  .speaker:active { transform: scale(.94); }

  .grid {
    --s: min(19vw, 15vh, 130px);
    display: grid;
    grid-template-columns: repeat(4, var(--s));
    gap: clamp(10px, 3vw, 24px);
    margin: clamp(10px, 3vh, 28px) 0;
  }
  .dot {
    width: var(--s); height: var(--s);
    border-radius: 50%;
    background: var(--col);
    border: 4px solid #ffffff1f;
    box-shadow: 0 8px 20px #00000050, inset 0 -6px 0 #00000026;
    cursor: pointer;
    position: relative;
    transition: transform .12s, opacity .3s;
  }
  .dot:hover { transform: scale(1.05); }
  .dot:active { transform: scale(.95); }
  .dot.right { border-color: var(--green); box-shadow: 0 0 0 5px #3ddc8466; }
  .dot.right::after {
    content: "✓";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: calc(var(--s) * .5);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px #000a;
  }
  .dot.faded { opacity: .25; pointer-events: none; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted); font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .toggle input { width: 20px; height: 20px; accent-color: var(--blue); }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1><span class="accent">Colours</span></h1>
  <div class="score" id="score">0</div>
</header>

<main>
  <div class="progress"><div id="bar"></div></div>
  <div class="prompt">
    <span class="label">Find</span>
    <span class="word" id="word"></span>
    <button class="speaker" id="say" aria-label="Listen" data-icon="sound"></button>
  </div>
  <div class="grid" id="grid"></div>
  <label class="toggle"><input type="checkbox" id="listen"> Listen only (hide the word)</label>
</main>

<footer>
  <button class="btn yellow" id="restart" data-icon="reset">Restart</button>
</footer>

<script src="../assets/common.js"></script>
<script>
  const ROUNDS = 10;
  const CHOICES = 8;
  const grid = document.getElementById("grid");
  const wordEl = document.getElementById("word");
  const bar = document.getElementById("bar");
  const scoreEl = document.getElementById("score");
  const listen = document.getElementById("listen");
  let round, score, target, firstTry, locked, last;

  function start() {
    round = 0;
    score = 0;
    last = null;
    scoreEl.textContent = 0;
    next(false);
  }

  function next(say = true) {
    if (round >= ROUNDS) {
      showResult({ score, total: ROUNDS, onAgain: start });
      return;
    }
    bar.style.width = (round / ROUNDS * 100) + "%";
    do { target = pick(COLOURS); } while (target === last);
    last = target;
    const others = sample(COLOURS.filter(c => c !== target), CHOICES - 1);
    const options = shuffle([target, ...others]);
    firstTry = true;
    locked = false;

    showWord(!listen.checked);
    grid.innerHTML = "";
    options.forEach(c => {
      const d = document.createElement("button");
      d.className = "dot";
      d.style.setProperty("--col", c[1]);
      d.setAttribute("aria-label", "colour");
      d.addEventListener("click", () => choose(d, c));
      grid.appendChild(d);
    });
    if (say) speak(target[0]);
  }

  function showWord(visible) {
    wordEl.textContent = visible ? target[0] : "? ? ?";
    wordEl.classList.toggle("masked", !visible);
  }

  function choose(dot, c) {
    if (locked) return;
    if (c === target) {
      locked = true;
      if (firstTry) { score++; scoreEl.textContent = score; }
      dot.classList.add("right");
      flash(dot, "pop");
      grid.querySelectorAll(".dot").forEach(d => { if (d !== dot) d.classList.add("faded"); });
      showWord(true);
      speak(target[0]);
      round++;
      bar.style.width = (round / ROUNDS * 100) + "%";
      setTimeout(next, 1100);
    } else {
      firstTry = false;
      flash(dot, "shake");
      speak(c[0]);
    }
  }

  document.getElementById("say").addEventListener("click", () => speak(target[0]));
  document.getElementById("restart").addEventListener("click", start);
  listen.addEventListener("change", () => {
    showWord(!listen.checked || locked);
    if (listen.checked) speak(target[0]);
  });

  start();
</script>
</body>
</html>
