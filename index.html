<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English for Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1726;
    --bg2: #13233a;
    --card: #182a44;
    --card-edge: #22385a;
    --text: #e8eef7;
    --muted: #8aa0bd;
    --green: #3ddc84;
    --blue: #3fa9f5;
    --yellow: #ffc93c;
    --purple: #9b6dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Rubik", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, #1d3a5f 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #2a1f55 0%, transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    background-attachment: fixed;
    padding: 40px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  h1 .accent {
    background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { text-align: center; font-size: 18px; margin: 0 0 36px; color: var(--muted); }
  h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--yellow);
    margin: 28px 0 14px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .task {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    background: linear-gradient(180deg, #1c3150, var(--card));
    border: 1px solid var(--card-edge);
    border-left: 4px solid var(--c, var(--green));
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    font-size: 20px; font-weight: 700;
    transition: transform .15s, border-color .15s;
  }
  .task:hover { transform: translateY(-3px); border-color: var(--c, var(--green)); }
  .task .ico {
    width: 46px; height: 46px; flex: none;
    display: grid; place-items: center;
    border-radius: 10px;
    background: color-mix(in srgb, var(--c, var(--green)) 18%, transparent);
    color: var(--c, var(--green));
    font-weight: 800; font-size: 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>English <span class="accent">for Kids</span></h1>
  <p class="sub">Обери задачку</p>

  <h2>Beginners</h2>
  <div class="grid">
    <a class="task" href="beginners/alphabet.html" style="--c: var(--green)"><span class="ico">ABC</span> Alphabet</a>
    <a class="task" href="beginners/alphabet-type.html" style="--c: var(--yellow)"><span class="ico">A_C</span> Type the Alphabet</a>
  </div>

  <h2>Голосні літери · Vowels</h2>
  <div class="grid">
    <a class="task" href="vowels/vowel-sounds.html" style="--c: var(--purple)"><span class="ico">Aa</span> Голосні звуки</a>
    <a class="task" href="vowels/hear-and-choose.html" style="--c: var(--purple)"><span class="ico">👂</span> Hear &amp; Choose</a>
    <a class="task" href="vowels/lost-letter.html" style="--c: var(--purple)"><span class="ico">c_t</span> Lost Letter</a>
    <a class="task" href="vowels/read-and-find.html" style="--c: var(--purple)"><span class="ico">📖</span> Read &amp; Find</a>
  </div>

  <h2>Words</h2>
  <div class="grid">
    <a class="task" href="words/picture-match.html" style="--c: var(--blue)"><span class="ico">🐱</span> Picture Match</a>
    <a class="task" href="words/colours.html" style="--c: var(--yellow)"><span class="ico">🎨</span> Colours</a>
  </div>

  <h2>Games</h2>
  <div class="grid">
    <a class="task" href="games/quiz-race.html" style="--c: var(--purple)"><span class="ico">🚀</span> Quiz Race</a>
    <a class="task" href="games/odd-one-out.html" style="--c: var(--green)"><span class="ico">🧩</span> Odd One Out</a>
    <a class="task" href="games/amazz.html" style="--c: var(--yellow)"><span class="ico">🚚</span> Amazz</a>
  </div>
</div>
</body>
</html>
