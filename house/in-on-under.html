<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In · On · Under</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/house.css">
<style>
  .answers { margin-top: 12px; }
  .ans { text-align: left; }
  .match .mi:not(.pic-item) { font-size: clamp(15px, 2.4vh, 20px); }
  .legend { color: var(--muted); font-size: clamp(14px, 2.1vh, 17px); margin-top: 4px; }
  .legend b { color: var(--text); }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>In · <span class="accent">On</span> · Under</h1>
</header>

<main>
  <div id="hud"></div>
  <p class="task" id="task"></p>
  <div id="stage" style="margin-top:10px; display:flex; flex-direction:column; align-items:center; width:100%"></div>
  <div class="explain" id="explain"></div>
  <div class="legend"><b>in</b> — в &nbsp;·&nbsp; <b>on</b> — на &nbsp;·&nbsp; <b>under</b> — під</div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
</footer>

<script src="../assets/common.js"></script>
<script src="../assets/house.js"></script>
<script>
  const TOTAL = 20;
  const stage = document.getElementById("stage"), task = document.getElementById("task");
  const same = (a, b) => a.animal === b.animal && a.prep === b.prep && a.furn === b.furn;
  const differsBy = (a, b) => (a.animal !== b.animal) + (a.prep !== b.prep) + (a.furn !== b.furn);

  // 2 wrong sentences that differ from the right one in just one thing (animal, place word or furniture)
  function distractors(s) {
    const close = shuffle(SCENES.filter(x => differsBy(x, s) === 1));
    const out = [];
    for (const x of close) {
      // prefer one that changes the preposition, so in/on/under is always practised
      if (out.length === 0 && x.prep === s.prep && close.some(y => y.prep !== s.prep)) continue;
      out.push(x);
      if (out.length === 2) break;
    }
    return out;
  }

  heartsGame({
    hearts: 5,
    makeRounds: () => {
      const order = rounds(SCENES, TOTAL);
      return order.map((s, i) => i % 4 === 3
        ? { type: "match", scenes: [s, ...sample(SCENES.filter(x => !same(x, s)), 2)] }
        : { type: "quiz", s });
    },
    render(r, g) {
      if (r.type === "quiz") {
        task.innerHTML = `Look and choose. <span class="ua">Подивись і обери правильне речення.</span>`;
        const opts = shuffle([r.s, ...distractors(r.s)]);
        stage.innerHTML = `<div class="scene">${sceneSVG(r.s)}</div>
          <div class="answers">${opts.map((o, k) => `<button class="ans" data-k="${k}">${sceneText(o)}</button>`).join("")}</div>`;
        const btns = stage.querySelectorAll(".ans");
        const good = btns[opts.indexOf(r.s)];
        btns.forEach(b => b.addEventListener("click", () => {
          if (g.busy) return;
          btns.forEach(x => x.disabled = true);
          good.classList.add("right");
          const t = sceneText(r.s);
          if (b === good) { flash(b, "pop"); g.right(t, t); }
          else { b.classList.add("wrong"); flash(b, "shake"); g.wrong(`Правильно: <b>${t}</b>`, t); }
        }));
      } else {
        task.innerHTML = `Match the pictures and the sentences. <span class="ua">З'єднай картинку з реченням.</span>`;
        stage.innerHTML = `<div id="board"></div>`;
        const pairs = r.scenes.map(s => ({ left: sceneSVG(s), right: sceneText(s), msg: sceneText(s), say: sceneText(s) }));
        matchBoard(stage.querySelector("#board"), pairs, g, { leftCls: "pic-item" });
      }
    },
  });
</script>
</body>
</html>
