<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/house.css">
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>New <span class="accent">Words</span></h1>
</header>

<main>
  <div id="hud"></div>
  <p class="task" id="task"></p>
  <div id="stage" style="margin-top:10px; display:flex; flex-direction:column; align-items:center; width:100%"></div>
  <div class="explain" id="explain"></div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
</footer>

<script src="../assets/common.js"></script>
<script src="../assets/house.js"></script>
<script>
  const stage = document.getElementById("stage"), task = document.getElementById("task");

  function finish(g, w, b, good) {
    const msg = `<b>${w.en}</b> <span class="ua">— ${w.ua}</span>`;
    if (b === good) { flash(b, "pop"); g.right(msg, w.en); }
    else { b.classList.add("wrong"); flash(b, "shake"); g.wrong(`It's ${msg}`, w.en); }
  }

  heartsGame({
    hearts: 4,
    makeRounds: () => shuffle(WORDS).map((w, i) => ({ w, mode: i % 2 ? "hear" : "look" })),
    render({ w, mode }, g) {
      const opts = optionsFor(w, WORDS);
      if (mode === "look") {
        task.innerHTML = `Look and choose the word. <span class="ua">Що на картинці?</span>`;
        stage.innerHTML = `${wordPic(w, "photo")}
          <div class="answers grid2">${opts.map((o, k) => `<button class="ans" data-k="${k}">${o.en}</button>`).join("")}</div>`;
      } else {
        task.innerHTML = `Listen and find the picture. <span class="ua">Послухай і знайди картинку.</span>`;
        stage.innerHTML = `<div class="qline"><button class="snd" id="say" aria-label="Listen">🔊</button>
            <span class="txt">Listen! 👂</span></div>
          <div class="pics">${opts.map((o, k) => `<button class="pic" data-k="${k}">${wordPic(o)}<span class="cap">${o.en}</span></button>`).join("")}</div>`;
        stage.querySelector("#say").addEventListener("click", () => speak(w.en, .75));
        speak(w.en, .75);
      }
      const btns = stage.querySelectorAll("[data-k]");
      const good = btns[opts.indexOf(w)];
      btns.forEach(b => b.addEventListener("click", () => {
        if (g.busy) return;
        btns.forEach(x => x.disabled = true);
        good.classList.add("right");
        finish(g, w, b, good);
      }));
    },
  });
</script>
</body>
</html>
