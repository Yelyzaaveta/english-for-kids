<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Left or Right?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/house.css">
<style>
  .home-plan { width: min(520px, 100%); }
  .roof { height: clamp(26px, 6vh, 48px); background: #b5523b; clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 -14px; }
  .halves {
    display: grid; grid-template-columns: 1fr 6px 1fr; gap: 10px;
    padding: 10px; background: #e9d8bf22; border: 3px solid #6c7f9c; border-top: 0;
  }
  .wall { background: #6c7f9c; border-radius: 3px; }
  .half { display: flex; flex-direction: column; gap: 10px; }
  .room { position: relative; border-radius: 12px; overflow: hidden; border: 3px solid transparent; transition: border-color .2s; }
  .room img { display: block; width: 100%; height: min(15vh, 28vw); object-fit: cover; }
  main { justify-content: safe center; }
  .room span {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px;
    background: #0b1220c8; font-weight: 700; font-size: clamp(13px, 2.1vh, 17px); text-align: center;
  }
  .room.ask { border-color: var(--yellow); }
  .room.right { border-color: var(--green); }
  .lr { display: flex; justify-content: space-between; margin-top: 6px; font-weight: 800; font-size: clamp(15px, 2.4vh, 19px); color: var(--blue); }
  .answers { margin-top: 4px; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>Left or <span class="accent">Right?</span></h1>
</header>

<main>
  <div id="hud"></div>
  <div class="qline">
    <span class="txt" id="q"></span>
    <button class="snd" id="say" aria-label="Listen" data-icon="sound"></button>
  </div>
  <div class="home-plan">
    <div class="roof"></div>
    <div class="halves">
      <div class="half" id="left"></div>
      <div class="wall"></div>
      <div class="half" id="right"></div>
    </div>
    <div class="lr"><span>left</span><span>right</span></div>
  </div>
  <div class="answers" id="answers">
    <button class="ans" data-side="left">It is on the left.</button>
    <button class="ans" data-side="right">It is on the right.</button>
  </div>
  <div class="explain" id="explain"></div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
</footer>

<script src="../assets/common.js"></script>
<script src="../assets/house.js"></script>
<script>
  let q = "", cur, game;
  const tile = k => `<div class="room" data-k="${k}"><img src="${IMG}${PLACES[k].img}" alt=""></div>`;

  game = heartsGame({
    hearts: 3,
    makeRounds: () => rounds(ROOM_KEYS, 10).map(ask => {
      const order = shuffle(ROOM_KEYS);
      return { ask, left: order.slice(0, 2), right: order.slice(2), side: order.indexOf(ask) < 2 ? "left" : "right" };
    }),
    render(r, g) {
      cur = r;
      document.getElementById("left").innerHTML = r.left.map(tile).join("");
      document.getElementById("right").innerHTML = r.right.map(tile).join("");
      q = `Where is the ${PLACES[r.ask].en}?`;
      document.getElementById("q").innerHTML = `Where is the <b>${PLACES[r.ask].en}</b>?`;
      document.querySelectorAll("#answers .ans").forEach(b => { b.disabled = false; b.classList.remove("right", "wrong"); });
    },
  });

  document.querySelectorAll("#answers .ans").forEach(b => b.addEventListener("click", () => {
    if (game.busy || !cur) return;
    document.querySelectorAll("#answers .ans").forEach(x => x.disabled = true);
    const good = document.querySelector(`#answers [data-side="${cur.side}"]`);
    good.classList.add("right");
    document.querySelector(`.room[data-k="${cur.ask}"]`).classList.add("right");
    const ans = `It is on the ${cur.side}.`;
    const ua = cur.side === "left" ? "зліва" : "справа";
    const msg = `${q} — <b>${ans}</b> <span class="ua">(${PLACES[cur.ask].ua} — ${ua})</span>`;
    if (b === good) { flash(b, "pop"); game.right(msg, `${q} ${ans}`); }
    else { b.classList.add("wrong"); flash(b, "shake"); game.wrong(msg, `${q} ${ans}`); }
  }));
  document.getElementById("say").addEventListener("click", () => q && speak(q));
</script>
</body>
</html>
