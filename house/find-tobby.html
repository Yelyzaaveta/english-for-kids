<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Is Tobby?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="../assets/house.css">
<style>
  .cards {
    --w: min(40vw, 30vh, 230px);
    display: grid;
    grid-template-columns: repeat(4, var(--w));
    gap: clamp(10px, 2vw, 16px);
  }
  @media (max-aspect-ratio: 5/4) { .cards { grid-template-columns: repeat(2, var(--w)); } }
  .card {
    padding: 4px; border-radius: 16px;
    border: 3px solid var(--card-edge);
    background: var(--card);
    cursor: pointer;
    box-shadow: 0 8px 20px #00000040;
    transition: border-color .15s, opacity .3s, transform .1s;
  }
  .card:hover { border-color: var(--yellow); }
  .card:active { transform: scale(.97); }
  .card svg { display: block; width: 100%; height: auto; border-radius: 12px; }
  .card.right { border-color: var(--green); }
  .card.wrong { border-color: var(--red); opacity: .4; }
  .card:disabled { cursor: default; }
  .who { font-size: clamp(15px, 2.4vh, 19px); color: var(--muted); margin-top: 8px; font-style: italic; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>Where is <span class="accent">Tobby?</span></h1>
  <div class="score" id="score">0</div>
</header>

<main>
  <div class="progress"><div id="bar"></div></div>
  <p class="who">Eddie: Tobby, Tobby! Where are you? 🐶</p>
  <div class="qline">
    <span class="txt" id="q"></span>
    <button class="snd" id="say" aria-label="Listen" data-icon="sound"></button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="explain" id="explain"></div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
  <button class="btn green" id="next" data-icon="next">Next</button>
</footer>

<script src="../assets/common.js"></script>
<script src="../assets/house.js"></script>
<script>
  const ROUNDS = 10;
  // What furniture stands in each room
  const IN_ROOM = {
    kitchen:  ["table", "chair"],
    living:   ["sofa", "table", "chair"],
    bedroom:  ["bed", "chair", "box"],
    bathroom: ["box"],
  };
  const PLACES = Object.entries(IN_ROOM).flatMap(([room, fs]) =>
    fs.flatMap(furn => PREPS_FOR[furn].map(prep => ({ room, furn, prep }))));
  const same = (a, b) => a.room === b.room && a.furn === b.furn && a.prep === b.prep;
  const CLUES = [
    p => `Tobby is <b>${p.prep}</b> the <b>${p.furn}</b> in the <b>${ROOMS[p.room].en}</b>.`,
    p => `Look! It is <b>${p.prep}</b> the <b>${p.furn}</b> in the <b>${ROOMS[p.room].en}</b>!`,
    p => `The dog is <b>${p.prep}</b> the <b>${p.furn}</b> in the <b>${ROOMS[p.room].en}</b>.`,
  ];

  const $ = id => document.getElementById(id);
  const cards = $("cards"), explain = $("explain"), bar = $("bar"), scoreEl = $("score"), nextBtn = $("next");
  let queue, round, score, firstTry, done, place, clueText;

  function start() {
    queue = sample(PLACES, ROUNDS);
    round = 0; score = 0;
    scoreEl.textContent = 0;
    bar.style.width = "0%";
    newRound();
  }

  // 3 wrong pictures that differ in only one thing: the word, the furniture or the room
  function distractors(p) {
    const others = PLACES.filter(x => !same(x, p));
    const byPrep = others.filter(x => x.room === p.room && x.furn === p.furn);
    const byFurn = others.filter(x => x.room === p.room && x.prep === p.prep);
    const byRoom = others.filter(x => x.furn === p.furn && x.prep === p.prep);
    const out = [];
    for (const group of [byPrep, byRoom, byFurn, byPrep, byRoom, byFurn, others]) {
      const cand = shuffle(group).find(x => !out.some(o => same(o, x)));
      if (cand && out.length < 3) out.push(cand);
    }
    while (out.length < 3) {
      const cand = pick(others);
      if (!out.some(o => same(o, cand))) out.push(cand);
    }
    return out;
  }

  function newRound() {
    place = queue[round];
    firstTry = true; done = false;
    explain.innerHTML = "";
    nextBtn.classList.remove("show");
    const html = pick(CLUES)(place);
    $("q").innerHTML = html;
    clueText = $("q").textContent;
    cards.innerHTML = "";
    shuffle([place, ...distractors(place)]).forEach(p => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = sceneSVG({ ...p, thing: "🐶", label: true });
      b.addEventListener("click", () => choose(b, p));
      cards.appendChild(b);
    });
  }

  function describe(p) {
    return `${p.prep} the ${p.furn} in the ${ROOMS[p.room].en}`;
  }
  function describeUa(p) {
    const where = p.prep === "under" ? `під ${UA_UNDER[p.furn]}` : `${PREPS[p.prep]} ${UA_ON_IN[p.furn]}`;
    return `${where} ${UA_ROOM_IN[p.room]}`;
  }

  function choose(btn, p) {
    if (done) return;
    if (!same(p, place)) {
      firstTry = false;
      btn.classList.add("wrong");
      btn.disabled = true;
      flash(btn, "shake");
      explain.innerHTML = `Here Tobby is <b>${describe(p)}</b>. Read again!`;
      return;
    }
    done = true;
    if (firstTry) { score++; scoreEl.textContent = score; }
    round++;
    bar.style.width = (round / ROUNDS * 100) + "%";
    btn.classList.add("right");
    flash(btn, "pop");
    cards.querySelectorAll(".card").forEach(b => b.disabled = true);
    explain.innerHTML = `Oh, Tobby! 🐶 <b>${describe(place)}</b><br><span class="ua">Тоббі ${describeUa(place)}.</span>`;
    speak(clueText);
    nextBtn.lastChild.textContent = round >= ROUNDS ? "Finish" : "Next";
    nextBtn.classList.add("show");
  }

  nextBtn.addEventListener("click", () => {
    if (round >= ROUNDS) showResult({ score, total: ROUNDS, onAgain: start });
    else newRound();
  });
  $("say").addEventListener("click", () => clueText && speak(clueText));
  $("restart").addEventListener("click", start);
  start();
</script>
</body>
</html>
