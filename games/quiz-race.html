<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<style>
  .track {
    position: relative;
    width: min(620px, 100%);
    height: 46px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    display: flex; align-items: center;
    padding: 0 22px;
  }
  .track .steps {
    flex: 1; height: 4px;
    background: repeating-linear-gradient(90deg, var(--card-edge) 0 10px, transparent 10px 18px);
    position: relative;
  }
  .rocket {
    position: absolute; top: 50%;
    left: 0;
    transform: translate(-50%, -50%) rotate(45deg);
    font-size: 28px;
    transition: left .5s cubic-bezier(.3, 1.3, .5, 1);
  }
  .finish { position: absolute; right: 10px; font-size: 22px; }
  .meta {
    display: flex; justify-content: space-between;
    width: min(620px, 100%);
    color: var(--muted); font-weight: 700; font-size: 15px;
    margin: 8px 0 0;
    letter-spacing: 1px;
  }
  .question {
    text-align: center;
    margin: clamp(10px, 3vh, 28px) 0 clamp(10px, 2.5vh, 24px);
    min-height: clamp(90px, 20vh, 180px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .question .text { font-size: clamp(20px, 3.6vh, 30px); font-weight: 700; }
  .question .big { font-size: clamp(54px, 12vh, 110px); line-height: 1; }
  .question .swatch {
    width: clamp(70px, 13vh, 120px); height: clamp(70px, 13vh, 120px);
    border-radius: 50%;
    border: 4px solid #ffffff1f;
    box-shadow: 0 8px 20px #00000050;
  }
  .question .word { font-size: clamp(34px, 7vh, 60px); font-weight: 800; color: var(--yellow); }
  .answers {
    width: min(620px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 1.6vh, 14px);
  }
  .answer {
    min-height: clamp(56px, 10vh, 86px);
    border-radius: 14px;
    border: 2px solid var(--card-edge);
    background: linear-gradient(180deg, var(--card-top), var(--card));
    color: var(--text);
    font: inherit; font-weight: 700;
    font-size: clamp(17px, 3vh, 24px);
    padding: 8px 12px;
    cursor: pointer;
    transition: border-color .15s, background .2s, transform .1s;
  }
  .answer.emoji { font-size: clamp(30px, 6vh, 50px); }
  .answer:hover { border-color: var(--blue); }
  .answer:active { transform: scale(.97); }
  .answer.right { border-color: var(--green); background: #3ddc8433; color: var(--green); }
  .answer.wrong { border-color: var(--red); background: #ff5a5f33; color: var(--red); }
  .answer:disabled { cursor: default; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>Quiz <span class="accent">Race</span></h1>
  <div class="score" id="score">0</div>
</header>

<main>
  <div class="track">
    <div class="steps"><span class="rocket" id="rocket">🚀</span></div>
    <span class="finish">🏁</span>
  </div>
  <div class="meta"><span id="qnum">1 / 10</span><span id="timer">0:00</span></div>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
</main>

<footer>
  <button class="btn yellow" id="restart" data-icon="reset">Restart</button>
</footer>

<script src="../assets/common.js"></script>
<script>
  const TOTAL = 10;

  // Fixed questions: grammar, phrases, opposites
  const BANK = [
    { text: "I ___ a dog.", options: ["have", "has", "am", "is"] },
    { text: "She ___ got a cat.", options: ["has", "have", "is", "are"] },
    { text: "They ___ my friends.", options: ["are", "is", "am", "has"] },
    { text: "I ___ eight years old.", options: ["am", "is", "are", "have"] },
    { text: "He ___ my brother.", options: ["is", "am", "are", "have"] },
    { text: "This is ___ apple.", options: ["an", "a"] },
    { text: "This is ___ banana.", options: ["a", "an"] },
    { text: "A bird can ___.", options: ["fly", "swim", "read", "cook"] },
    { text: "A fish can ___.", options: ["swim", "fly", "run", "jump"] },
    { text: "one cat, two ___", options: ["cats", "cat", "cates", "catss"] },
    { text: "one dog, three ___", options: ["dogs", "dog", "doges", "dogies"] },
    { text: "big ↔ ?", options: ["small", "tall", "long", "happy"] },
    { text: "hot ↔ ?", options: ["cold", "warm", "sunny", "big"] },
    { text: "happy ↔ ?", options: ["sad", "good", "funny", "nice"] },
    { text: "“What's your name?”", options: ["My name is Max.", "I'm fine.", "I'm nine.", "Yes, I can."] },
    { text: "“How old are you?”", options: ["I'm nine.", "My name is Max.", "I'm fine.", "No, I can't."] },
    { text: "“How are you?”", options: ["I'm fine, thank you.", "I'm nine.", "It's a cat.", "Yes, I do."] },
    { text: "“Can you swim?”", options: ["Yes, I can.", "Yes, I am.", "I'm fine.", "It's red."] },
    { text: "“What colour is it?”", options: ["It's green.", "It's a dog.", "I'm ten.", "Yes, it is."] },
  ].map(q => ({ ...q, answer: q.options[0], say: q.options[0].length < 20 }));

  // Generated questions
  const GEN = [
    () => { // picture -> word
      const t = pick(Object.values(TOPICS));
      const words = sample(t.words, 4);
      return { big: words[0][1], text: "What is it?", options: words.map(w => w[0]), answer: words[0][0], say: true };
    },
    () => { // word -> picture
      const t = pick(Object.values(TOPICS));
      const words = sample(t.words, 4);
      return { word: words[0][0], text: "Find:", options: words.map(w => w[1]), answer: words[0][1], emoji: true, sayWord: words[0][0] };
    },
    () => { // colour
      const cs = sample(COLOURS, 4);
      return { swatch: cs[0][1], text: "What colour is it?", options: cs.map(c => c[0]), answer: cs[0][0], say: true };
    },
    () => { // number word -> digit
      const ns = sample([...Array(21).keys()].slice(1), 4);
      return { word: NUMBERS[ns[0]], text: "What number is it?", options: ns.map(String), answer: String(ns[0]), sayWord: NUMBERS[ns[0]] };
    },
    () => { // digit -> number word
      const ns = sample([...Array(21).keys()].slice(1), 4);
      return { big: String(ns[0]), text: "How do you say it?", options: ns.map(n => NUMBERS[n]), answer: NUMBERS[ns[0]], say: true };
    },
    () => { // days
      const i = Math.floor(Math.random() * 6);
      const opts = sample(DAYS.filter(d => d !== DAYS[i + 1]), 3);
      return { text: `What day comes after <b style="color:var(--yellow)">${DAYS[i]}</b>?`, options: [DAYS[i + 1], ...opts], answer: DAYS[i + 1], say: true };
    },
  ];

  const qEl = document.getElementById("question");
  const aEl = document.getElementById("answers");
  const rocket = document.getElementById("rocket");
  const scoreEl = document.getElementById("score");
  const qnum = document.getElementById("qnum");
  const timerEl = document.getElementById("timer");
  let questions, index, score, startTime, timerId;

  function buildQuiz() {
    // ~40% fixed questions, the rest generated
    const fixed = sample(BANK, 4);
    const gen = Array.from({ length: TOTAL - fixed.length }, (_, i) => GEN[i % GEN.length]());
    return shuffle([...fixed, ...gen]);
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  function start() {
    questions = buildQuiz();
    index = 0;
    score = 0;
    scoreEl.textContent = 0;
    rocket.style.left = "0%";
    startTime = Date.now();
    clearInterval(timerId);
    timerId = setInterval(() => timerEl.textContent = fmt(Date.now() - startTime), 250);
    timerEl.textContent = "0:00";
    show();
  }

  function show() {
    const q = questions[index];
    qnum.textContent = `${index + 1} / ${TOTAL}`;
    let html = "";
    if (q.big) html += `<div class="big">${q.big}</div>`;
    if (q.swatch) html += `<div class="swatch" style="background:${q.swatch}"></div>`;
    html = `<div class="text">${q.text}</div>` + html;
    if (q.word) html += `<div class="word">${q.word}</div>`;
    qEl.innerHTML = html;

    aEl.innerHTML = "";
    shuffle(q.options).forEach(opt => {
      const b = document.createElement("button");
      b.className = "answer" + (q.emoji ? " emoji" : "");
      b.textContent = opt;
      b.addEventListener("click", () => answer(b, opt));
      aEl.appendChild(b);
    });
    if (q.sayWord && index > 0) speak(q.sayWord);
  }

  function answer(btn, opt) {
    const q = questions[index];
    aEl.querySelectorAll(".answer").forEach(b => b.disabled = true);
    const ok = opt === q.answer;
    if (ok) {
      score++;
      scoreEl.textContent = score;
      btn.classList.add("right");
      flash(btn, "pop");
    } else {
      btn.classList.add("wrong");
      flash(btn, "shake");
      aEl.querySelectorAll(".answer").forEach(b => { if (b.textContent === q.answer) b.classList.add("right"); });
    }
    if (q.say) speak(q.answer);
    else if (q.sayWord) speak(q.sayWord);
    rocket.style.left = (score / TOTAL * 100) + "%";

    setTimeout(() => {
      index++;
      if (index < TOTAL) show();
      else {
        clearInterval(timerId);
        showResult({ score, total: TOTAL, extra: "⏱ " + fmt(Date.now() - startTime), onAgain: start });
      }
    }, ok ? 900 : 1600);
  }

  document.getElementById("restart").addEventListener("click", start);
  start();
</script>
</body>
</html>
