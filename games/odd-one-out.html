<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odd One Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<style>
  .task { color: var(--muted); font-size: clamp(18px, 3vh, 24px); font-weight: 700; margin: 14px 0 0; text-align: center; }
  .cards {
    --w: min(40vw, 22vh, 170px);
    display: grid;
    grid-template-columns: repeat(4, var(--w));
    gap: clamp(10px, 2vw, 20px);
    margin: clamp(14px, 4vh, 36px) 0 clamp(10px, 2vh, 20px);
  }
  @media (max-aspect-ratio: 4/5) {
    .cards { grid-template-columns: repeat(2, var(--w)); }
  }
  .card {
    height: calc(var(--w) * 1.2);
    border-radius: 16px;
    border: 2px solid var(--card-edge);
    background: linear-gradient(180deg, var(--card-top), var(--card));
    color: var(--text);
    font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
    box-shadow: 0 8px 20px #00000040;
    transition: border-color .15s, background .2s, opacity .3s, transform .1s;
  }
  .card:hover { border-color: var(--blue); }
  .card:active { transform: scale(.97); }
  .card .e { font-size: calc(var(--w) * .42); line-height: 1; }
  .card .w { font-size: calc(var(--w) * .15); font-weight: 700; }
  .card .cat {
    font-size: calc(var(--w) * .09); font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); min-height: 1.2em;
  }
  .card.right { border-color: var(--green); background: #3ddc8422; }
  .card.right .cat { color: var(--green); }
  .card.wrong { border-color: var(--red); }
  .card.dim { opacity: .55; }
  .card:disabled { cursor: default; }
  .explain {
    min-height: 2.6em;
    text-align: center;
    font-size: clamp(16px, 2.8vh, 22px);
    font-weight: 700;
    max-width: 620px;
  }
  .explain b { color: var(--green); }
  #next { display: none; }
  #next.show { display: inline-flex; }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../" aria-label="Home"></a>
  <h1>Odd <span class="accent">One Out</span></h1>
  <div class="score" id="score">0</div>
</header>

<main>
  <div class="progress"><div id="bar"></div></div>
  <p class="task">Which one is different?</p>
  <div class="cards" id="cards"></div>
  <div class="explain" id="explain"></div>
</main>

<footer>
  <button class="btn ghost" id="restart" data-icon="reset">Restart</button>
  <button class="btn green" id="next" data-icon="next">Next</button>
</footer>

<script src="../assets/common.js"></script>
<script>
  const ROUNDS = 10;
  const GROUP = { animals: "animals", food: "food", clothes: "clothes", school: "school things", toys: "toys" };
  const cardsEl = document.getElementById("cards");
  const explain = document.getElementById("explain");
  const nextBtn = document.getElementById("next");
  const bar = document.getElementById("bar");
  const scoreEl = document.getElementById("score");
  let round, score, firstTry, done;

  function start() {
    round = 0;
    score = 0;
    scoreEl.textContent = 0;
    bar.style.width = "0%";
    newRound();
  }

  function newRound() {
    const [main, other] = sample(Object.keys(TOPICS), 2);
    const items = [
      ...sample(TOPICS[main].words, 3).map(w => ({ w, topic: main, odd: false })),
      { w: pick(TOPICS[other].words), topic: other, odd: true },
    ];
    firstTry = true;
    done = false;
    explain.innerHTML = "";
    nextBtn.classList.remove("show");
    cardsEl.innerHTML = "";
    shuffle(items).forEach(item => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<span class="e">${item.w[1]}</span><span class="w">${item.w[0]}</span><span class="cat"></span>`;
      b.addEventListener("click", () => choose(b, item, main));
      b._item = item;
      cardsEl.appendChild(b);
    });
  }

  function choose(card, item, main) {
    if (done) return;
    speak(item.w[0]);
    if (!item.odd) {
      firstTry = false;
      card.classList.add("wrong");
      flash(card, "shake");
      setTimeout(() => card.classList.remove("wrong"), 500);
      return;
    }
    done = true;
    if (firstTry) { score++; scoreEl.textContent = score; }
    round++;
    bar.style.width = (round / ROUNDS * 100) + "%";
    card.classList.add("right");
    flash(card, "pop");
    cardsEl.querySelectorAll(".card").forEach(c => {
      c.disabled = true;
      c.querySelector(".cat").textContent = TOPICS[c._item.topic].title;
      if (c !== card) c.classList.add("dim");
    });
    explain.innerHTML = `${item.w[1]} <b>${item.w[0]}</b> — ${GROUP[item.topic]}. The others — ${GROUP[main]}.`;
    nextBtn.textContent = round >= ROUNDS ? "Finish" : "Next";
    nextBtn.insertAdjacentHTML("afterbegin", ICON_NEXT);
    nextBtn.classList.add("show");
  }

  nextBtn.addEventListener("click", () => {
    if (round >= ROUNDS) showResult({ score, total: ROUNDS, onAgain: start });
    else newRound();
  });
  document.getElementById("restart").addEventListener("click", start);
  start();
</script>
</body>
</html>
