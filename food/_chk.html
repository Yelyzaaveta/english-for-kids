<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Goes Shopping — Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/worksheet.css">
<style>
  /* orange theme for the food workbook */
  :root {
    --ink: #3a2410;
    --p: #e8741a; --p-dark: #8a3b00; --p-soft: #fff1e3; --p-mid: #f6b982;
    --line: #f1dcc6; --muted: #98826c; --desk: #eadfd3;
  }
  h1 { color: var(--p-dark); }
  .head { background: var(--p-dark); color: #ffe6d0; border: 0; border-radius: 10px; padding: 7px 14px; margin-bottom: 11px; }
  .head b { color: #fff; }
  .head .name span { border-bottom-color: rgba(255,255,255,.55); }
  .foot .num { background: var(--p-dark); color: #fff; }
  .ex-title .n { background: var(--p-dark); }
  .ex-title { font-size: 16px; }
  .ex { margin-bottom: 9px; }
  .photo { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--p-soft); }
  .blank { display: inline-block; min-width: 24mm; height: 1.15em; border-bottom: 2px solid var(--p); vertical-align: bottom; margin: 0 2px; }
  .blank.s { min-width: 13mm; } .blank.l { min-width: 44mm; } .blank.xl { min-width: 0; flex: 1; }
  .box { border-color: var(--p-mid); }
  .bank { display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; margin-bottom: 8px;
    padding: 6px 10px; background: var(--p-soft); border: 1.5px dashed var(--p-mid); border-radius: 12px; }
  .bank > b { font: 700 11px "Rubik", sans-serif; color: var(--p-dark); letter-spacing: .6px; text-transform: uppercase; margin-right: 4px; }
  .bank span { padding: 1px 10px; background: #fff; border: 1.5px solid var(--p-mid); border-radius: 20px;
    font: 700 16px "Andika", sans-serif; color: var(--p-dark); }
  .opt { display: inline-flex; gap: 6px; }
  .opt span { padding: 0 9px; border: 1.5px dashed var(--p-mid); border-radius: 20px; font: 700 17px "Andika", sans-serif; color: var(--p-dark); }
  .lines > div { display: flex; align-items: flex-end; gap: 8px; font: 400 21px "Andika", sans-serif; padding: 3px 0; }
  .lines .blank { flex: 1; }
  .no { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--p-dark); color: #fff;
    display: grid; place-items: center; font: 700 13px "Rubik", sans-serif; }

  /* Page 1: word cards */
  .wgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5mm; }
  .wcard { display: grid; grid-template-columns: 25mm 1fr; gap: 3mm; align-items: center; height: 29mm; padding: 1.8mm;
    border: 2px solid var(--p-mid); border-radius: 13px; background: #fff; }
  .wcard .im { height: 25mm; border-radius: 9px; overflow: hidden; }
  .wcard .en { font: 700 17px/1.1 "Andika", sans-serif; color: var(--p-dark); }
  .wcard .en i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--p); margin-left: 4px; vertical-align: middle; }
  .wcard .ua { font-size: 11px; line-height: 1.2; margin-top: 2px; }
  .legend { margin-top: 3mm; font: 500 12px "Rubik", sans-serif; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--p); margin-right: 4px; }

  /* Page 2: grammar */
  .rule2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-bottom: 9px; }
  .rule2 > div { border-radius: 14px; background: var(--p-soft); border: 2px solid var(--p-mid); padding: 8px 12px; }
  .rule2 h3 { margin: 0 0 4px; font: 800 16px "Rubik", sans-serif; color: var(--p-dark); }
  .rule2 h3 small { font: 400 11px "Rubik", sans-serif; color: var(--muted); }
  .rule2 p { margin: 1px 0; font: 400 16px/1.3 "Andika", sans-serif; }
  .rule2 b { color: var(--p); }
  .sort2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .sort2 > div { border: 2px solid var(--line); border-radius: 14px; padding: 5px 10px 4px; }
  .sort2 h4 { margin: 0 0 2px; font: 700 14px "Rubik", sans-serif; color: var(--p-dark); }
  .sort2 h4 small { font: 400 11px "Rubik", sans-serif; color: var(--muted); }
  .sort2 .blank { display: block; width: 100%; height: 6.4mm; margin: 0; border-bottom-width: 1.5px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8mm; }
  .two > div { display: flex; align-items: flex-end; gap: 8px; font: 400 18.5px "Andika", sans-serif; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .two .k { font: 700 13px "Rubik", sans-serif; color: var(--p); width: 16px; flex: none; }

  /* Page 3: story */
  .family { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; margin-bottom: 9px; }
  .family > div { text-align: center; padding: 3px 4px; border-radius: 14px; background: var(--p-soft); border: 2px solid var(--p-mid); }
  .family .emo { font-size: 24px; line-height: 1.1; display: inline-block; vertical-align: middle; margin-right: 4px; }
  .family b { display: inline; font: 700 14px "Andika", sans-serif; color: var(--p-dark); }
  .family small { display: block; font: 400 10px "Rubik", sans-serif; color: var(--muted); }
  .story { padding: 3.5mm 5mm; border-radius: 14px; background: #fff; border: 2px solid var(--p-mid); margin-bottom: 9px; position: relative; }
  .story p { margin: 0 0 4px; font: 400 18px/1.36 "Andika", sans-serif; }
  .story p:last-child { margin: 0; }
  .story p b { color: var(--p-dark); }
  .story q { quotes: "‘" "’"; color: var(--p-dark); }
  .noteS { float: right; width: 46mm; margin: 0 0 3mm 5mm; padding: 3mm 4mm; background: #fff4b8; color: #4a3b00; border-radius: 5px;
    transform: rotate(1.5deg); box-shadow: 1px 2px 5px rgba(0,0,0,.2); font: 700 14px/1.35 "Andika", sans-serif; }
  .noteS h5 { margin: 0 0 2px; font: 700 10px "Rubik", sans-serif; letter-spacing: 1px; text-transform: uppercase; color: #a07a00; }
  .words5 { font: 400 11.5px/1.45 "Rubik", sans-serif; color: var(--muted); margin: 0 0 9px; }
  .words5 b { color: var(--p-dark); font-weight: 600; }
  .tf { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  .tf li { counter-increment: t; display: flex; align-items: center; gap: 10px; padding: 1px 4px; border-bottom: 1px dashed var(--line);
    font: 400 18.5px "Andika", sans-serif; }
  .tf li::before { content: counter(t) "."; width: 22px; font: 700 14px "Rubik", sans-serif; color: var(--p); }
  .tf .yn { margin-left: auto; display: flex; gap: 8px; }
  .tf .yn span { padding: 0 9px; border: 2px solid var(--p-mid); border-radius: 20px; font: 700 15px "Andika", sans-serif; color: var(--p-dark); }

  /* Page 4: sort + circle + numbers */
  .sort4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5mm; }
  .sort4 > div { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .sort4 h4 { margin: 0; padding: 5px 7px; background: var(--p-dark); color: #fff; font: 700 12.5px/1.2 "Rubik", sans-serif; min-height: 11mm; }
  .sort4 h4 small { display: block; font: 400 10px "Rubik", sans-serif; color: #ffd9b8; }
  .sort4 .blank { display: block; width: auto; height: 7.2mm; margin: 0 6px; border-bottom-width: 1.5px; }
  .circ { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .circ span { text-align: center; padding: 3px 2px; border: 1.5px solid var(--line); border-radius: 10px; font: 700 15.5px "Andika", sans-serif; color: var(--p-dark); }
  .tally { margin-top: 6px; font: 500 14px "Rubik", sans-serif; color: var(--p-dark); }
  .qnum { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 7mm; }
  .qnum > div { display: flex; align-items: flex-end; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font: 400 18.5px/1.2 "Andika", sans-serif; }
  .qnum .k { font: 700 13px "Rubik", sans-serif; color: var(--p); width: 16px; flex: none; }
  .qnum .box { width: 15mm; height: 8mm; margin-left: auto; flex: none; border: 2px solid var(--p-mid); border-radius: 8px; background: var(--p-soft); }

  /* Page 5: write */
  .qa { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; }
  .qa > div { padding: 2.5mm 4mm; border: 2px solid var(--line); border-radius: 14px; }
  .qa .q { font: 700 17px "Andika", sans-serif; color: var(--p-dark); }
  .qa .a { display: flex; align-items: flex-end; margin-top: 2mm; }
  .qa .a .blank { flex: 1; height: 1.45em; min-width: 0; }
  .party { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8mm; }
  .party > div { display: grid; grid-template-columns: 18px 24mm 1fr; gap: 6px; align-items: end; padding: 3px 0; font: 700 13px "Rubik", sans-serif; color: var(--p); }
  .party .blank { display: block; width: auto; margin: 0; height: 7mm; }
  .write { font: 400 22px/2 "Andika", sans-serif; }

  /* Page 6: riddles + odd one out */
  .rid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5mm; }
  .rid > div { padding: 2.5mm 3.5mm 3mm; border: 2px solid var(--line); border-radius: 14px; }
  .rid .t { display: flex; gap: 8px; font: 400 18px/1.3 "Andika", sans-serif; }
  .rid .a { display: flex; align-items: flex-end; gap: 6px; margin-top: 2mm; font: 700 13px "Rubik", sans-serif; color: var(--p); }
  .rid .a .blank { flex: 1; height: 1.3em; min-width: 0; }
  .oddw { display: grid; gap: 3.5mm; }
  .oddw > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .oddw .w { padding: 1px 9px; border: 1.5px solid var(--p-mid); border-radius: 20px; font: 700 17px "Andika", sans-serif; color: var(--p-dark); }

  /* Page 7: letters + syllables */
  .gap4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5mm; }
  .gc { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; text-align: center; padding-bottom: 6px; }
  .gc .im { height: 31mm; margin-bottom: 5px; }
  .gc .w { font: 400 21px "Andika", sans-serif; display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; letter-spacing: 1px; }
  .gc .box { width: 16px; height: 24px; margin: 0 1px; background: var(--p-soft); border-width: 2px; }
  .cloud { display: flex; flex-wrap: wrap; gap: 5px 7px; justify-content: center; padding: 7px 10px; margin-bottom: 7px;
    background: var(--p-soft); border: 1.5px dashed var(--p-mid); border-radius: 12px; }
  .cloud span { padding: 0 10px; background: #fff; border: 1.5px solid var(--p-mid); border-radius: 8px; font: 700 18px "Andika", sans-serif; color: var(--p-dark); }
  .syls .r { display: grid; grid-template-columns: 22px 52mm 1fr; gap: 8px; align-items: end; padding: 2px 0; font: 400 13px "Rubik", sans-serif; color: var(--muted); }
  .syls .r b { font-weight: 700; color: var(--p); }
  .syls .r .blank { display: block; width: auto; margin: 0; height: 7mm; }

  .mm { display: grid; grid-template-columns: 1fr 1fr; gap: 0 58mm; padding: 0 8mm; }
  .mm > div { display: flex; align-items: center; gap: 9px; height: 20mm; }
  .mm .L { justify-content: flex-end; }
  .mm .pim { width: 32mm; height: 17.5mm; border-radius: 7px; overflow: hidden; }
  .mm .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--p-dark); flex: none; }
  .mm .k { font: 700 12px "Rubik", sans-serif; color: var(--p); width: 16px; }
  .mm .L .k { text-align: right; }
  .mm .word { font: 400 22px "Andika", sans-serif; }

  /* Page 8: wordsearch + pets */
  .ws { display: grid; grid-template-columns: repeat(11, 1fr); width: 116mm; flex: none; border: 2px solid var(--p-dark); border-radius: 12px; overflow: hidden; }
  .ws i { font: 700 22px "Andika", sans-serif; font-style: normal; text-align: center; line-height: 10.5mm; height: 10.5mm; color: var(--ink); border: .5px solid var(--line); }
  .wsrow { display: flex; gap: 6mm; align-items: flex-start; }
  .wslist { flex: 1; display: grid; gap: 4px; }
  .wslist div { padding: 2px 10px; border: 1.5px solid var(--line); border-radius: 10px; font: 700 17px "Andika", sans-serif; color: var(--p-dark); }
  .pets { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .pets > div { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .pets .s { font: 700 19px/1.3 "Andika", sans-serif; color: #fff; background: var(--p-dark); padding: 7px 12px; display: flex; align-items: flex-end; gap: 6px; }
  .pets .s .blank { flex: 1; min-width: 0; border-bottom-color: #ffd9b8; }
  .pets .sq { height: 58mm; position: relative; }
  .pets .sq span { position: absolute; right: 8px; bottom: 4px; font-size: 30px; opacity: .35; }
  .dlg > div { padding: 3px 0; font: 400 19px/1.35 "Andika", sans-serif; border-bottom: 1px dashed var(--line); }
  .dlg b { color: var(--p-dark); }
  .stars { display: flex; gap: 14px; margin-top: 8px; font: 500 15px "Rubik", sans-serif; align-items: center; }
  .stars b { color: var(--p-dark); } .stars i { font-style: normal; color: var(--p-mid); font-size: 26px; letter-spacing: 3px; }
</style>
</head>
<body>

<div class="bar">
  <a href="../index.html">← На головну</a>
  <button onclick="window.print()">Друкувати / зберегти PDF</button>
  <span class="hint">У вікні друку: A4, поля «Немає», увімкнути «Фонова графіка»</span>
</div>

<div id="root"></div>

<script src="../assets/food.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const boxes = n => '<span class="box"></span>'.repeat(n);
  const blank = (c = "") => `<span class="blank ${c}"></span>`;
  const ph = w => `<img class="photo" src="${FIMG}${w.img}" alt="">`;
  const F = en => FOOD_BY[en];
  const TOTAL = 8;

  function page(n, title, tag, lead, body) {
    return `<section class="page">
      <div class="head"><b>Max Goes Shopping</b><span class="name">Ім'я: <span></span></span></div>
      <h1>${title} <span class="tag">${tag}</span></h1>
      ${lead ? `<p class="lead">${lead}</p>` : ""}
      ${body}
      <div class="foot"><span>Food · Workbook</span><span class="num">${n}</span></div>
    </section>`;
  }
  const exTitle = (n, en, ua) => `<div class="ex-title">${n === "" ? "" : `<span class="n">${n}</span>`} ${en} <small>${ua}</small></div>`;
  const hole = w => { const i = w.en.indexOf(w.gap); return [...w.en.slice(0, i)].map(c => c === " " ? `<span style="width:8px"></span>` : c).join("") + boxes(w.gap.length) + [...w.en.slice(i + w.gap.length)].map(c => c === " " ? `<span style="width:8px"></span>` : c).join(""); };
  const chips = list => list.map(x => `<span>${x}</span>`).join("");
  let exNo = 0; const N = () => ++exNo;
  const pages = [];

  // ===== 1. Words =====
  pages.push(page(1, "Food", "їжа · 21 слово", "Прочитай слова вголос. Точка ● означає, що це слово можна порахувати (one egg, two eggs…).",
    `<div class="wgrid">${FOOD.map(w => `<div class="wcard"><div class="im">${ph(w)}</div>
        <div><div class="en">${w.en}${w.count ? "<i></i>" : ""}</div><div class="ua">${w.ua}</div></div></div>`).join("")}</div>
     <div class="legend"><span><i></i> countable — можна порахувати</span><span>без точки — uncountable, не можна порахувати</span></div>`));

  // ===== 2. Countable / uncountable =====
  pages.push(page(2, "Some · Much · Many", "граматика", "",
    `<div class="rule2">
       <div><h3>🥚 Countable <small>можна порахувати</small></h3>
         <p>a biscuit · <b>an</b> egg · two eggs</p>
         <p>There <b>are</b> some eggs.</p>
         <p>How <b>many</b> eggs?</p></div>
       <div><h3>🥛 Uncountable <small>не можна порахувати</small></h3>
         <p>some milk · some rice</p>
         <p>There <b>is</b> some milk.</p>
         <p>How <b>much</b> milk?</p></div>
     </div>
     <div class="ex">${exTitle(N(), "Sort the foods", "розклади слова у дві колонки")}
       <div class="bank"><b>Words</b>${chips(["eggs", "milk", "cakes", "rice", "tomatoes", "cheese", "chips", "juice", "potatoes", "bread", "vegetables", "meat", "biscuits", "soup"])}</div>
       <div class="sort2">
         <div><h4>countable <small>(eggs…)</small></h4>${blank() .repeat(7)}</div>
         <div><h4>uncountable <small>(milk…)</small></h4>${blank().repeat(7)}</div>
       </div></div>
     <div class="ex">${exTitle(N(), "Write a, an or some", "впиши a, an або some")}
       <div class="two">${[
         ["Max bought", "bread."], ["Mum has", "egg for breakfast."], ["I want", "biscuit."], ["Aslan drinks", "milk."],
         ["There are", "tomatoes in the bag."], ["Bonya ate", "meat."], ["Give me", "cake, please."], ["Dad drinks", "juice."],
       ].map((s, i) => `<div><span class="k">${i + 1}</span><span>${s[0]} ${blank("s")} ${s[1]}</span></div>`).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Circle the right word", "обведи правильне слово")}
       <div class="two">${[
         ["There", "cheese", ["is", "are"], "in the fridge."], ["There", "eggs", ["is", "are"], "in the box."],
         ["How", "milk", ["much", "many"], "do we need?"], ["How", "potatoes", ["much", "many"], "do we need?"],
         ["There", "soup", ["is", "are"], "on the table."], ["There", "chips", ["is", "are"], "in the bag."],
         ["How", "rice", ["much", "many"], "do we need?"], ["How", "biscuits", ["much", "many"], "do we need?"],
       ].map((s, i) => `<div style="align-items:center;font-size:17px;gap:6px"><span class="k">${i + 1}</span><span style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">${s[0]}<span class="opt">${s[2].map(o => `<span>${o}</span>`).join("")}</span>${s[1]} ${s[3]}</span></div>`).join("")}</div></div>`));

  // ===== 3. Story =====
  pages.push(page(3, "Max Goes Shopping", "читаємо", "",
    `<div class="family">
        <div><div class="emo">👦</div><b>Max</b><small>Макс</small></div>
        <div><div class="emo">👩</div><b>Mum Tanya</b><small>мама Таня</small></div>
        <div><div class="emo">🐱</div><b>Aslan</b><small>кіт</small></div>
        <div><div class="emo">🐶</div><b>Bonya</b><small>собака</small></div>
     </div>
     <div class="ex">${exTitle(N(), "Read the story", "прочитай історію")}
       <div class="story">
         <div class="noteS"><h5>Shopping list</h5>bread<br>milk<br>eggs<br>cheese<br>tomatoes<br>rice<br>chicken<br>butter</div>
         <p>It was Saturday morning. Max’s mum, Tanya, gave him a <b>shopping list</b>. <q>Max, please go to the shop and buy everything on the list,</q> she said.</p>
         <p>Max went to the shop. He bought <b>bread</b>, two bottles of <b>milk</b>, ten <b>eggs</b>, some <b>cheese</b>, five <b>tomatoes</b> and a bag of <b>rice</b>. He also bought <b>sweet snacks</b>, <b>chips</b> and <b>lemonade</b> for himself.</p>
         <p>At home, Mum looked in the bag. <q>Max, where is the chicken? And where is the butter?</q> <q>Oh no! I forgot!</q> said Max.</p>
         <p>He went back to the shop and bought the <b>chicken</b> and the <b>butter</b>. He also bought some <b>meat</b> for his dog, Bonya.</p>
         <p>In the evening, Mum cooked chicken with rice and tomatoes. Aslan the cat drank some milk, and Bonya ate his meat. Max ate his chips and drank his lemonade. Everybody was happy!</p>
       </div>
       <p class="words5"><b>shopping list</b> — список покупок · <b>bought</b> — купив · <b>forgot</b> — забув · <b>went back</b> — повернувся · <b>bottle</b> — пляшка · <b>bag</b> — пакет · <b>cooked</b> — приготувала · <b>everybody</b> — усі</p>
     </div>
     <div class="ex">${exTitle(N(), "True or False?", "правда чи ні? — обведи")}
       <ol class="tf">${[
         "Max’s mum is Tanya.", "Max bought ten eggs.", "Max bought the chicken in the first shop trip.", "Max bought chips for Bonya.",
         "Max went to the shop two times.", "Aslan ate meat.", "Mum cooked chicken with rice and tomatoes.", "Max forgot the cheese.",
       ].map(t => `<li><span>${t}</span><span class="yn"><span>True</span><span>False</span></span></li>`).join("")}</ol>
       <div class="lines" style="margin-top:3px"><div style="font:700 13px 'Rubik'; color:var(--p-dark)">Correct two false sentences: <span style="font-weight:400;color:var(--muted)">виправ два неправильні речення</span></div>
         <div>${blank("xl")}</div><div>${blank("xl")}</div></div>
     </div>`));

  // ===== 4. Sort + circle + numbers =====
  const circ21 = ["cakes", "bread", "juice", "chicken", "pasta", "milk", "soup", "eggs", "fruit", "rice", "biscuits", "meat", "butter", "potatoes",
                  "chips", "vegetables", "cheese", "drinks", "lemonade", "tomatoes", "sweet snacks"];
  pages.push(page(4, "Who Got What?", "хто що отримав", "",
    `<div class="ex">${exTitle(N(), "Write the foods in the right box", "впиши продукти в потрібну колонку")}
       <div class="bank"><b>Words</b>${chips(["bread", "meat", "chips", "chicken", "milk", "sweet snacks", "eggs", "butter", "cheese", "lemonade", "rice", "tomatoes"])}</div>
       <div class="sort4">
         <div><h4>🛒 Bought at once<small>для мами, з першого разу</small></h4>${blank().repeat(6)}</div>
         <div><h4>😮 Forgot, then bought<small>забув, потім докупив</small></h4>${blank().repeat(6)}</div>
         <div><h4>😋 For Max himself<small>для себе</small></h4>${blank().repeat(6)}</div>
         <div><h4>🐶 For Bonya<small>для Боні</small></h4>${blank().repeat(6)}</div>
       </div></div>
     <div class="ex">${exTitle(N(), "Circle the foods that were in the story", "обведи продукти, які були в тексті")}
       <div class="circ">${circ21.map(x => `<span>${x}</span>`).join("")}</div>
       <div class="tally">How many foods were in the story? ${blank("s")} &nbsp; <span style="color:var(--muted)">скільки було в тексті?</span></div>
     </div>
     <div class="ex">${exTitle(N(), "How many?", "скільки? — впиши число")}
       <div class="qnum">${[
         "How many things were on Mum’s list?", "How many eggs did Max buy?", "How many bottles of milk did he buy?",
         "How many tomatoes did he buy?", "How many things did Max forget?", "How many foods did he buy for himself?",
         "How many foods did Max buy in the first trip (for Mum)?", "How many different foods did Max buy in all?",
       ].map((q, i) => `<div><span class="k">${i + 1}</span><span>${q}</span><span class="box"></span></div>`).join("")}</div></div>`));

  // ===== 5. Write =====
  pages.push(page(5, "Write It", "пиши", "",
    `<div class="ex">${exTitle(N(), "Answer in full sentences", "дай відповідь повним реченням")}
       <div class="qa">${[
         ["Who is Tanya?", "She is"], ["What did Max buy for himself?", "He bought"], ["What did Max forget?", "He forgot"],
         ["What did Max buy for Bonya?", "He bought"], ["What did Aslan drink?", "Aslan drank"], ["Why did Max go back to the shop?", "Because"],
       ].map((q, i) => `<div><div class="q">${i + 1}. ${q[0]}</div><div class="a"><span style="font:400 18px 'Andika'">${q[1]}</span>${blank("xl")}</div><div class="a">${blank("xl")}</div></div>`).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Max has a birthday party! Write his shopping list", "у Макса день народження — склади список покупок")}
       <p class="note" style="margin:0 0 5px;font-size:12px;color:var(--muted)">Use numbers and a / an / some: <b style="color:var(--p-dark)">ten eggs, some cheese, a bag of rice</b></p>
       <div class="party">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<div><span>${n}</span>${blank()}${blank()}</div>`).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Write about you", "напиши про себе")}
       <div class="write">
         <div>I like ${blank("l")}.</div>
         <div>I don’t like ${blank("l")}.</div>
         <div>For breakfast I eat ${blank("l")}.</div>
         <div>My favourite drink is ${blank("l")}.</div>
       </div></div>`));

  // ===== 6. Riddles + odd one out =====
  const RID = [
    ["It is white. We get it from cows. Aslan the cat loves to drink it.", "milk"],
    ["It is yellow and it has holes. Mice love it.", "cheese"],
    ["Hens give us these. We can boil or fry them.", "eggs"],
    ["It is hot. We eat it with a spoon.", "soup"],
    ["It is small and white. People in China and Japan eat it every day.", "rice"],
    ["Italians love it. Spaghetti is one kind of it.", "pasta"],
    ["It is yellow and soft. We put it on bread.", "butter"],
    ["It is orange. We drink it for breakfast. It comes from oranges.", "juice"],
  ];
  const ODD = [
    ["bread", "cakes", "biscuits", "chicken"], ["milk", "juice", "lemonade", "rice"], ["butter", "cheese", "milk", "bread"],
    ["chips", "biscuits", "sweet snacks", "soup"], ["pasta", "rice", "bread", "juice"], ["chicken", "meat", "eggs", "tomatoes"],
  ];
  pages.push(page(6, "Food Detective", "детектив", "",
    `<div class="ex">${exTitle(N(), "Read the clues. Who am I?", "прочитай підказки й відгадай")}
       <div class="bank"><b>Words</b>${chips(["rice", "soup", "milk", "pasta", "juice", "eggs", "butter", "cheese"])}</div>
       <div class="rid">${RID.map((r, i) => `<div><div class="t"><span class="no">${i + 1}</span><span>${r[0]}</span></div>
         <div class="a">I am${blank()}</div></div>`).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Odd one out", "обведи зайве слово")}
       <div class="oddw">${ODD.map((o, i) => `<div><span class="no">${i + 1}</span>${o.map(x => `<span class="w">${x}</span>`).join("")}</div>`).join("")}</div>
       <p class="note" style="margin:8px 0 0;font-size:12px;color:var(--muted)">Подумай: чому саме це слово зайве? Розкажи вголос: “… is not …”.</p>
     </div>`));

  // ===== 7. Match + syllables =====
  const SYL = [["bis", "cuits"], ["to", "ma", "toes"], ["veg", "e", "ta", "bles"], ["lem", "on", "ade"], ["pas", "ta"], ["po", "ta", "toes"], ["chick", "en"], ["but", "ter"]];
  const SYL_UA = ["печиво", "помідори", "овочі", "лимонад", "макаронні вироби", "картопля", "курятина", "вершкове масло"];
  const cloud = SYL.flat().map((s, i) => [s, (i * 7 + 3) % 23]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const MPIC = ["pasta", "cheese", "tomatoes", "rice", "juice", "meat"], MPERM = [3, 5, 1, 0, 4, 2];
  const MLET = "ABCDEF";
  pages.push(page(7, "Match and Syllables", "з'єднай · склади", "",
    `<div class="ex">${exTitle(N(), "Match the picture and the word", "з'єднай картинку зі словом")}
       <div class="mm">${MPIC.map((w, i) => `<div class="L"><span class="k">${i + 1}</span><span class="pim">${ph(F(w))}</span><span class="dot"></span></div>
          <div class="R"><span class="dot"></span><span class="word">${MPIC[MPERM[i]]}</span><span class="k">${MLET[i]}</span></div>`).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Syllable puzzle", "склади слова зі складів")}
       <div class="cloud">${cloud.map(s => `<span>${s}</span>`).join("")}</div>
       <div class="syls">${SYL.map((s, i) => `<div class="r"><b>${i + 1}</b><span>${SYL_UA[i]} <i style="font-style:normal">(${s.length} ${s.length > 1 ? "parts" : "part"})</i></span>${blank()}</div>`).join("")}</div></div>`));

  // ===== 8. Missing letters + pets =====
  const GAPS = ["biscuits", "cheese", "chicken", "eggs", "fruit", "lemonade", "potatoes", "soup", "tomatoes", "vegetables", "pasta", "butter"];
  pages.push(page(8, "Letters and Pets", "літери · улюбленці", "",
    `<div class="ex">${exTitle(N(), "Write the missing letters", "впиши пропущені літери")}
       <div class="gap4">${GAPS.map(g => { const w = F(g); return `<div class="gc"><div class="im">${ph(w)}</div><div class="w">${hole(w)}</div></div>`; }).join("")}</div></div>
     <div class="ex">${exTitle(N(), "Dinner for Aslan and Bonya", "що на вечерю в Аслана й Боні? Напиши й намалюй")}
       <div class="pets">
         <div><div class="s">Aslan drinks some${blank()}.</div><div class="sq"><span>🐱</span></div></div>
         <div><div class="s">Bonya eats some${blank()}.</div><div class="sq"><span>🐶</span></div></div>
       </div></div>`));

  const WS_WORDS = [
    ["BUTTER", 0, 0, 0, 1], ["CHEESE", 2, 4, 0, 1], ["BREAD", 4, 0, 0, 1], ["JUICE", 4, 5, 0, 1], ["PASTA", 6, 5, 0, 1],
    ["EGGS", 8, 3, 0, 1], ["MEAT", 10, 0, 0, 1],
    ["CAKES", 6, 10, 1, 0], ["RICE", 6, 0, 1, 0], ["MILK", 6, 2, 1, 0], ["SOUP", 7, 8, 1, 0], ["CHIPS", 0, 10, 1, 0],
  ];
  const GN = 11;
  const grid = Array.from({ length: GN }, () => Array(GN).fill(""));
  WS_WORDS.forEach(([w, r, c, dr, dc]) => [...w].forEach((ch, i) => {
    const y = r + dr * i, x = c + dc * i;
    if (y >= GN || x >= GN) throw new Error("wordsearch out of grid " + w);
    if (grid[y][x] && grid[y][x] !== ch) throw new Error("wordsearch clash " + w);
    grid[y][x] = ch;
  }));
  let seed = 11;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const FILL = "ABDFGHKLMNOPRTUW";
  grid.forEach(row => row.forEach((v, x) => { if (!v) row[x] = FILL[Math.floor(rnd() * FILL.length)]; }));
  pages.push(page(9, "Word Search and Shop", "знайди слова · у магазині", "",
    `<div class="ex">${exTitle(N(), "Find 12 foods and circle them", "знайди 12 продуктів (→ та ↓)")}
       <div class="wsrow"><div class="ws">${grid.map(r => r.map(c => `<i>${c}</i>`).join("")).join("")}</div>
         <div class="wslist">${WS_WORDS.map(w => `<div>${w[0].toLowerCase()}</div>`).join("")}</div></div></div>
     <div class="ex">${exTitle(N(), "At the shop", "у магазині: впиши пропущені слова")}
       <div class="bank"><b>Words</b>${chips(["many", "much", "some", "ten", "Thank you"])}</div>
       <div class="dlg">
         <div><b>Max:</b> Good morning! I want ${blank("s")} bread, please.</div>
         <div><b>Shop assistant:</b> Here you are. Anything else?</div>
         <div><b>Max:</b> Yes, ${blank("s")} eggs, please.</div>
         <div><b>Shop assistant:</b> OK. How ${blank("s")} milk do you want?</div>
         <div><b>Max:</b> Two bottles, please. And some tomatoes.</div>
         <div><b>Shop assistant:</b> How ${blank("s")} tomatoes?</div>
         <div><b>Max:</b> Five, please. ${blank("s")} very much! Goodbye!</div>
       </div></div>
     <div class="stars"><b>Я молодець!</b><i>★ ★ ★ ★ ★</i></div>`));

  $("root").innerHTML = pages.join("");
  setTimeout(()=>{document.title="CHK "+[...document.querySelectorAll(".page")].map((p,i)=>{const f=p.querySelector(".foot");const b=[...p.children].filter(c=>c!==f);const last=Math.max(...b.map(c=>c.getBoundingClientRect().bottom));return (i+1)+":"+Math.round(last+9-f.getBoundingClientRect().top)+"/"+(p.scrollHeight-p.clientHeight)}).join(" ")},1500);
</script>
</body>
</html>
